  note: "upstream's test:javascript:no-jest borp groups (without test:wpt and test:cache-tests, which need submodules) and test:jest, against the packed package at the tested commit: 3051 tests, 3032 passed, 0 failed, 19 skipped. The CVE tests (test/eventsource/eventsource-constructor.js test/eventsource/eventsource-stream.js), with this release's production lines reverted at the tested commit: 46 tests, 6 passed, 40 failed, 0 skipped; with them: 48 tests, 48 passed, 0 failed, 0 skipped. Built with no build step for shipped files, npm pack --ignore-scripts in a directory named undici, 192 of npmjs's 210 files for 7.29.1 are identical; the rest are docs/docs/api/Client.md, lib/core/symbols.js, lib/dispatcher/agent.js, lib/dispatcher/client-h1.js, lib/dispatcher/client-h2.js, lib/dispatcher/client.js, lib/dispatcher/dispatcher-base.js, lib/handler/cache-handler.js, lib/handler/deduplication-handler.js, lib/handler/redirect-handler.js, lib/interceptor/decompress.js, lib/web/eventsource/eventsource-stream.js, lib/web/eventsource/eventsource.js, lib/web/fetch/index.js, lib/web/infra/index.js, lib/web/subresource-integrity/subresource-integrity.js, package.json, types/client.d.ts. The archive's file-origins.yaml maps each packaged file to the commit, or names its inputs and build. test/issue-3356.js (upstream's regression test for nodejs/undici issue 3356) is a timing flake on this Mac: it timed out in both suite runs on npmjs's 7.29.1 and in 4 of the 8 runs of the items this line's counters port, so it is not caused by the fix. The suite failed only there on 1 run(s) and passed on run 2; the report is that run's."
