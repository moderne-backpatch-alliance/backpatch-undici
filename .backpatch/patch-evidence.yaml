  - cve: CVE-2026-109924
    upstream_fix_url: https://github.com/nodejs/undici/commit/299162740d5f39120092277e70efacb4d151c1c6
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-109924
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-undici/commit/7662fa1
    basis: backport
    artifacts:
      - undici
    note: "New in this release; upstream's fix in 7.30.1. An EventSource stream now bounds the bytes, data lines and buffered input chunks it keeps for one pending event and one unfinished line, and closes the connection with an error past that bound. This release adds a public option on a patch line, as upstream's 7.30.1 does: eventSource.maxEventSize on Client and the other dispatchers built on DispatcherBase, typed as Client.EventSourceOptions in types/client.d.ts. It is the bound on what an EventSource keeps for one event, in bytes, and also sets the bound on data lines and buffered chunks. Its default is upstream's, buffer.kStringMaxLength (about 512 MiB on 64-bit Node), so with the default a server can still make a client hold that much for one event; a lower value tightens the bound. An EventSource created without a dispatcher now uses the global dispatcher and reads the bound from it, and an event past the bound closes the EventSource connection with an error."
