  report_sha256: 8b3cad647625f36fd210111effc847a5ed080efc9dffa2ce2b83cb772bed1d17
  result: pass
  note: "upstream's test:javascript:no-jest borp groups (without test:wpt and test:cache-tests, which need submodules) and test:jest, against the packed package at the tested commit: 3020 tests, 3001 passed, 0 failed, 19 skipped. The CVE tests (test/fetch/encoding.js), with this release's production lines reverted at the tested commit: 8 tests, 6 passed, 2 failed, 0 skipped; with them: 7 tests, 7 passed, 0 failed, 0 skipped. Built with no build step for shipped files, npm pack --ignore-scripts in a directory named undici, 198 of npmjs's 210 files for 7.29.1 are identical; the rest are lib/core/symbols.js, lib/dispatcher/agent.js, lib/dispatcher/client-h1.js, lib/dispatcher/client-h2.js, lib/handler/cache-handler.js, lib/handler/deduplication-handler.js, lib/handler/redirect-handler.js, lib/interceptor/decompress.js, lib/web/fetch/index.js, lib/web/infra/index.js, lib/web/subresource-integrity/subresource-integrity.js, package.json. The archive's file-origins.yaml maps each packaged file to the commit, or names its inputs and build. test/issue-3356.js (upstream's regression test for nodejs/undici issue 3356) is a timing flake on this Mac: it timed out in both suite runs on npmjs's 7.29.1 and in 4 of the 8 runs of the items this line's counters port, so it is not caused by the fix. The suite passed on its first run."
